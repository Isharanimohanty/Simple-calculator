<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 320px;
      background: #1f1f1f;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .display {
      width: 100%;
      height: 80px;
      background: #2a2a2a;
      color: #fff;
      border: none;
      border-radius: 12px;
      text-align: right;
      font-size: 2rem;
      padding: 20px 15px;
      margin-bottom: 20px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      height: 60px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .operator {
      background: #ff9f0a;
      color: white;
    }

    .function {
      background: #a5a5a5;
      color: black;
    }

    .number {
      background: #d4d4d2;
      color: black;
    }

    .zero {
      grid-column: span 2;
    }

    .equals {
      background: #ff9f0a;
      color: white;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" id="display" type="text" readonly value="0" />

    <div class="buttons">
      <button class="function" onclick="clearDisplay()">C</button>
      <button class="function" onclick="deleteLast()">DEL</button>
      <button class="function" onclick="appendOperator('%')">%</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>

      <button class="number" onclick="appendNumber('7')">7</button>
      <button class="number" onclick="appendNumber('8')">8</button>
      <button class="number" onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('*')">×</button>

      <button class="number" onclick="appendNumber('4')">4</button>
      <button class="number" onclick="appendNumber('5')">5</button>
      <button class="number" onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('-')">−</button>

      <button class="number" onclick="appendNumber('1')">1</button>
      <button class="number" onclick="appendNumber('2')">2</button>
      <button class="number" onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button class="number zero" onclick="appendNumber('0')">0</button>
      <button class="number" onclick="appendNumber('.')">.</button>
      <button class="equals" onclick="calculateResult()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let currentValue = "0";
    let storedValue = null;
    let operator = null;

    function updateDisplay() {
      display.value = currentValue;
    }

    function clearDisplay() {
      currentValue = "0";
      storedValue = null;
      operator = null;
      updateDisplay();
    }

    function deleteLast() {
      if (currentValue.length > 1) {
        currentValue = currentValue.slice(0, -1);
      } else {
        currentValue = "0";
      }
      updateDisplay();
    }

    function appendNumber(value) {
      if (currentValue === "0" && value !== ".") {
        currentValue = value;
      } else {
        if (value === "." && currentValue.includes(".")) return;
        currentValue += value;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      if (operator && storedValue !== null) {
        calculateResult(true);
      }

      storedValue = Number(currentValue);
      operator = op;
      currentValue = "0";
      updateDisplay();
    }

    function calculateResult(fromOperator = false) {
      if (storedValue === null || operator === null) return;

      const value = Number(currentValue);
      let result = 0;

      switch (operator) {
        case "+":
          result = storedValue + value;
          break;
        case "-":
          result = storedValue - value;
          break;
        case "*":
          result = storedValue * value;
          break;
        case "/":
          result = value === 0 ? "Error" : storedValue / value;
          break;
        case "%":
          result = (storedValue * value) / 100;
          break;
        default:
          result = value;
      }

      if (result === "Error") {
        currentValue = "Error";
        storedValue = null;
        operator = null;
        updateDisplay();
        return;
      }

      currentValue = String(result);
      if (!fromOperator) {
        storedValue = null;
        operator = null;
      } else {
        storedValue = Number(currentValue);
      }

      updateDisplay();
    }
  </script>
</body>
</html>
